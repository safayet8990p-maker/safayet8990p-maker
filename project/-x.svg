<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="60" y="170" height="40" width="0">
        <animate attributeName="width" from="0" to="660" dur="3s" begin="0.8s" fill="freeze" calcMode="discrete"
                 values="0;15;29;44;59;73;88;103;117;132;147;161;176;191;205;220;235;249;264;279;293;308;323;337;352;367;381;396;411;425;440;455;469;484;499;513;528;543;557;572;587;601;616;631;645;660"
                 keyTimes="0;0.0227;0.0455;0.0682;0.0909;0.1136;0.1364;0.1591;0.1818;0.2045;0.2273;0.25;0.2727;0.2955;0.3182;0.3409;0.3636;0.3864;0.4091;0.4318;0.4545;0.4773;0.5;0.5227;0.5455;0.5682;0.5909;0.6136;0.6364;0.6591;0.6818;0.7045;0.7273;0.75;0.7727;0.7955;0.8182;0.8409;0.8636;0.8864;0.9091;0.9318;0.9545;0.9773;0.9886;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect width="900" height="300" rx="18" fill="url(#dots)"/>

  <!-- Floating decorative circles -->
  <circle cx="780" cy="70" r="46" fill="#38bdf8" fill-opacity="0.12">
    <animate attributeName="cy" values="70;90;70" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="220" r="30" fill="#c084fc" fill-opacity="0.15">
    <animate attributeName="cy" values="220;200;220" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="250" r="16" fill="#38bdf8" fill-opacity="0.2">
    <animate attributeName="cx" values="700;720;700" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Window dots -->
  <circle cx="60" cy="48" r="6" fill="#ff5f56"/>
  <circle cx="82" cy="48" r="6" fill="#ffbd2e"/>
  <circle cx="104" cy="48" r="6" fill="#27c93f"/>

  <!-- Title -->
  <text x="60" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#accent)">
    Hi, I'm Safayet Hossain Noor 
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <!-- Typing subtitle -->
  <g clip-path="url(#typeClip)">
    <text x="60" y="198" font-family="'Courier New', Consolas, monospace" font-size="24" fill="#e2e8f0">
      &gt; Fully | Open Source Lover
    </text>
  </g>

  <!-- Blinking cursor -->
  <rect x="62" y="178" width="3" height="26" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom accent line -->
  <rect x="60" y="250" width="180" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;180" dur="1.2s" fill="freeze"/>
  </rect>
</svg>
